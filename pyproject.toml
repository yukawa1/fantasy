[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy_agn"
version = "2.0.0"
description = "FANTASY - Fully Automated pythoN tool for AGN Spectra analYsis: fast multi-component fitting of AGN spectra with reliable uncertainties, single- and multi-epoch."
readme = "README.md"
authors = [{ name = "Nemanja Rakić", email = "rakinemanja@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "astropy>=5.0",
    "pandas>=1.3",
    "matplotlib>=3.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
gui = ["ipywidgets>=8", "ipython"]
dust = ["sfdmap2"]
dev = ["pytest"]

[project.urls]
Documentation = "https://fantasy-agn.readthedocs.io"
Source = "https://github.com/yukawa1/fantasy"

[project.scripts]
fantasy-app = "fantasy_agn.app:main"

[tool.setuptools]
packages = ["fantasy_agn", "fantasy_agn.app"]

[tool.setuptools.package-data]
fantasy_agn = ["data/*.csv", "data/*.fits"]
"fantasy_agn.app" = ["static/*", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
