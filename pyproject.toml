[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy_agn"
dynamic = ["version"]          # from fantasy_agn.__version__: one place to change it
description = "FANTASY - Fully Automated pythoN tool for AGN Spectra analYsis: fast multi-component fitting of AGN spectra with reliable uncertainties, single- and multi-epoch."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Nemanja Rakić", email = "rakinemanja@gmail.com" }, { name = "Dragana Ilić" },
           { name = "Luka Č. Popović" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "astropy>=5.0",
    "pandas>=1.3",
    "matplotlib>=3.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dust = ["sfdmap2"]
dev = ["pytest"]

[project.urls]
Documentation = "https://fantasy-agn.readthedocs.io"
Source = "https://github.com/yukawa1/fantasy"

[project.scripts]
fantasy = "fantasy_agn.cli:main"
fantasy-app = "fantasy_agn.app:main"

[tool.setuptools]
packages = ["fantasy_agn", "fantasy_agn.app"]

[tool.setuptools.dynamic]
version = { attr = "fantasy_agn.__version__" }

[tool.setuptools.package-data]
fantasy_agn = ["data/*.csv", "data/*.fits", "data/examples/*.fits"]
"fantasy_agn.app" = ["static/*", "static/img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
